# netlify.toml — Brumar
# Sitio estático (sin build) + funciones serverless para Meta Conversions API.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------- Rutas ----------
# Endpoint de eventos del navegador → CAPI. Un nombre neutro evita bloqueos de adblockers.
[[redirects]]
  from = "/api/evento"
  to = "/.netlify/functions/capi"
  status = 200
  force = true

# URL corta del webhook para Cal.com (la larga también funciona)
[[redirects]]
  from = "/api/cal-webhook"
  to = "/.netlify/functions/cal-webhook"
  status = 200
  force = true

# ---------- Seguridad ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ---------- Caché ----------
# CSS/JS se revisan en cada visita (cambios visibles al instante tras un deploy),
# pero el navegador reutiliza su copia si no cambió (ETag).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Páginas del embudo: nunca en caché ni indexadas.
[[headers]]
  for = "/gracias-*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/pago.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/ai.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
